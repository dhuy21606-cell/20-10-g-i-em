<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Chúc mừng 20/10 💖</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Dancing+Script:wght@600&family=Be+Vietnam+Pro:wght@300;400;600&display=swap&subset=vietnamese"
      rel="stylesheet"
    />
    <style>
      :root {
        --pink: #ff6fae;
        --rose: #ff3d84;
        --gold: #ffd9a8;
        --text: #fff1f6;
        --serif: "Playfair Display", Georgia, serif;
        --script: "Dancing Script", "Segoe Script", cursive;
        --sans: "Be Vietnam Pro", "Segoe UI", Arial, sans-serif;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: radial-gradient(circle at 50% 30%, #4a1240, #2a0a24 70%);
        color: var(--text);
        font-family: var(--sans);
      }
      .glow {
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.35;
        pointer-events: none;
      }
      .g1 {
        width: 50vmax;
        height: 50vmax;
        background: #ff2d8a;
        left: -15vmax;
        top: -10vmax;
      }
      .g2 {
        width: 40vmax;
        height: 40vmax;
        background: #8a3dff;
        right: -12vmax;
        bottom: -10vmax;
      }
      .star {
        position: fixed;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #fff;
        animation: tw 3s infinite alternate;
        pointer-events: none;
      }
      @keyframes tw {
        from {
          opacity: 0.1;
        }
        to {
          opacity: 0.9;
          box-shadow: 0 0 8px #fff;
        }
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        transition:
          opacity 1s,
          transform 1s;
        z-index: 2;
        text-align: center;
      }
      #stage.hide {
        opacity: 0;
        transform: scale(0.92);
        pointer-events: none;
      }
      .line {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0 0.35em;
        font-family: var(--serif);
        font-weight: 900;
        line-height: 1.15;
        padding: 0 0.5rem;
      }
      .word {
        display: flex;
      }
      .l1 {
        font-size: clamp(1.8rem, 8vw, 3.8rem);
        color: #fff;
      }
      .l2 {
        font-size: clamp(2.4rem, 11vw, 5.6rem);
        color: var(--pink);
        text-shadow: 0 0 30px var(--rose);
      }
      .slot {
        display: inline-block;
        opacity: 0;
      }
      .slot.ok {
        opacity: 1;
        animation: pop 0.6s;
      }
      @keyframes pop {
        0% {
          transform: scale(1.6);
          filter: brightness(2.5);
        }
        100% {
          transform: none;
          filter: none;
        }
      }
      .fly {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 3;
        pointer-events: none;
        font-family: var(--serif);
        font-weight: 900;
        color: #ffb3d4;
        text-shadow: 0 0 14px var(--rose);
        will-change: transform;
        transition: opacity 1s;
      }
      #hint {
        font-family: var(--script);
        font-size: 1.6rem;
        color: var(--gold);
        animation: pulse 1.6s infinite;
        padding: 0 1rem;
      }
      @keyframes pulse {
        50% {
          opacity: 0.5;
          transform: scale(1.05);
        }
      }
      #btn {
        padding: 0.85rem 2rem;
        border: 0;
        border-radius: 99px;
        font: 600 1.05rem var(--sans);
        color: #fff;
        cursor: pointer;
        background: linear-gradient(135deg, #ff6fae, #ff3d84);
        box-shadow: 0 0 28px rgba(255, 61, 132, 0.55);
        transition: transform 0.2s;
        z-index: 5;
      }
      #btn:hover {
        transform: scale(1.07);
      }
      #card {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        padding: 1rem;
        z-index: 4;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.2s;
        overflow-y: auto;
      }
      #card.show {
        opacity: 1;
        pointer-events: auto;
      }
      .box {
        position: relative;
        margin: auto;
        max-width: 420px;
        width: 100%;
        text-align: center;
        padding: 1.5rem 1.1rem 1.1rem;
        border-radius: 24px;
        background: linear-gradient(
          160deg,
          rgba(255, 255, 255, 0.13),
          rgba(255, 255, 255, 0.04)
        );
        border: 1px solid rgba(255, 182, 213, 0.4);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow:
          0 25px 90px rgba(255, 61, 132, 0.35),
          inset 0 0 40px rgba(255, 150, 200, 0.08);
        transform: scale(0.85) translateY(30px);
        transition: transform 1.2s cubic-bezier(0.2, 1.3, 0.3, 1);
      }
      #card.show .box {
        transform: none;
      }
      .badge {
        display: inline-block;
        padding: 0.25rem 0.8rem;
        border-radius: 99px;
        font-size: 0.66rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #4a1240;
        font-weight: 600;
        background: linear-gradient(90deg, #ffd9a8, #ffb3d4);
        box-shadow: 0 0 20px rgba(255, 217, 168, 0.5);
      }
      .big {
        font-size: 2.1rem;
        margin: 0.4rem 0 0;
        animation: beat 1.2s infinite;
      }
      @keyframes beat {
        15% {
          transform: scale(1.25);
        }
        30% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.18);
        }
      }
      .t1 {
        font-family: var(--script);
        font-size: 1.25rem;
        color: var(--gold);
        margin: 0;
      }
      .t2 {
        font-family: var(--serif);
        font-size: clamp(1.7rem, 8vw, 2.4rem);
        margin: 0 0 0.2rem;
        background: linear-gradient(
          90deg,
          #ff9ec8,
          #fff,
          #ffd9a8,
          #ff6fae,
          #ff9ec8
        );
        background-size: 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: sh 5s linear infinite;
      }
      @keyframes sh {
        to {
          background-position: -250% 0;
        }
      }
      .orn {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        justify-content: center;
        color: var(--pink);
        margin: 0.4rem 0 1rem;
      }
      .orn:before,
      .orn:after {
        content: "";
        height: 1px;
        width: 22%;
        background: linear-gradient(90deg, transparent, var(--pink));
      }
      .orn:after {
        transform: scaleX(-1);
      }
      #msg {
        font-weight: 300;
        font-size: 0.9rem;
        line-height: 1.7;
        min-height: 6.4em;
        margin: 0 0.3rem;
      }
      .wishes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.45rem;
        margin: 0.8rem 0;
      }
      .w {
        padding: 0.55rem 0.45rem;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 182, 213, 0.25);
        opacity: 0;
        transform: translateY(20px) scale(0.9);
        transition: all 0.8s cubic-bezier(0.2, 1.4, 0.3, 1);
      }
      .w.on {
        opacity: 1;
        transform: none;
      }
      .w i {
        font-style: normal;
        font-size: 1.2rem;
        display: block;
      }
      .w b {
        display: block;
        font-family: var(--serif);
        font-size: 0.82rem;
        color: #ffc2dc;
        margin: 0.2rem 0;
      }
      .w span {
        font-size: 0.68rem;
        font-weight: 300;
        opacity: 0.85;
        line-height: 1.5;
        display: block;
      }
      .quote {
        font-family: var(--script);
        font-size: 1.15rem;
        color: var(--gold);
        line-height: 1.5;
        opacity: 0;
        transition: opacity 1.2s;
      }
      .sign {
        font-family: var(--script);
        font-size: 1.2rem;
        color: var(--pink);
        margin: 0.4rem 0 0.3rem;
        opacity: 0;
        transition: opacity 1.2s;
      }
      .on2 {
        opacity: 1;
      }
      .btns {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6rem;
        opacity: 0;
        transition: opacity 1s;
      }
      .b2 {
        padding: 0.6rem 1.5rem;
        border: 1px solid rgba(255, 182, 213, 0.5);
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        font: 600 0.9rem var(--sans);
        cursor: pointer;
      }
      .btns small {
        font-size: 0.7rem;
        opacity: 0.65;
        letter-spacing: 0.06em;
        font-weight: 300;
      }
      .love {
        margin: 1rem 0 0.4rem;
        padding: 1rem 0.8rem;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px dashed rgba(255, 182, 213, 0.4);
        opacity: 0;
        transition: opacity 1s;
      }
      .love h2 {
        font-family: var(--serif);
        font-size: 1.3rem;
        margin: 0 0 0.5rem;
        color: #ffc2dc;
      }
      .love img {
        width: 150px;
        max-width: 60%;
        border-radius: 14px;
        display: block;
        margin: 0 auto 0.6rem;
      }
      .bear {
        font-size: 4rem;
        display: block;
        animation: beat 1.2s infinite;
      }
      .lv-act {
        position: relative;
        height: 96px;
      }
      .lv-act button {
        border: 0;
        border-radius: 99px;
        color: #fff;
        font: 600 1rem var(--sans);
        cursor: pointer;
        padding: 0.6rem 1.6rem;
      }
      #yes {
        position: absolute;
        left: 50%;
        top: 0;
        transform: translateX(-120%);
        background: linear-gradient(135deg, #ff6fae, #ff3d84);
        box-shadow: 0 0 22px rgba(255, 61, 132, 0.55);
        transition:
          font-size 0.3s,
          padding 0.3s;
      }
      #no {
        position: absolute;
        left: 50%;
        top: 0;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 182, 213, 0.5);
        transition:
          left 0.25s,
          top 0.25s;
      }
      .love .ok-txt {
        font-size: 0.95rem;
        color: var(--gold);
        font-family: var(--script);
        font-size: 1.3rem;
        margin: 0;
      }
      .heart {
        position: fixed;
        bottom: -50px;
        z-index: 1;
        pointer-events: none;
        animation: up linear forwards;
        filter: drop-shadow(0 0 8px rgba(255, 61, 132, 0.7));
      }
      @keyframes up {
        to {
          transform: translate(var(--dx), -115vh) rotate(var(--rot));
          opacity: 0;
        }
      }
      .burst {
        position: fixed;
        z-index: 9;
        pointer-events: none;
        animation: bst 0.9s ease-out forwards;
      }
      @keyframes bst {
        to {
          transform: translate(var(--bx), var(--by)) scale(0.3);
          opacity: 0;
        }
      }
      @media (pointer: fine) {
        * {
          cursor: none !important;
        }
      }
      #cur {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 99;
        pointer-events: none;
        font-size: 26px;
        color: #ff3d84;
        text-shadow:
          0 0 12px #ff3d84,
          0 0 28px #ff6fae;
        opacity: 0;
        transition: opacity 0.3s;
      }
      #cur span {
        display: inline-block;
        animation: beat 1.2s infinite;
      }
      .trail {
        position: fixed;
        z-index: 98;
        pointer-events: none;
        color: #ff6fae;
        transform: translate(-50%, -50%);
        animation: tr 1.1s ease-out forwards;
      }
      @keyframes tr {
        to {
          transform: translate(calc(-50% + var(--tx)), -90px) scale(0.4);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="glow g1"></div>
    <div class="glow g2"></div>

    <div id="stage">
      <div class="line l1" id="l1"></div>
      <div class="line l2" id="l2"></div>
      <div id="hint">✦ Có một thông điệp đang bay lạc… ✦</div>
      <button id="btn">Giải mã 💌</button>
    </div>

    <div id="card">
      <div class="box">
        <span class="badge">20 · 10 &nbsp;Ngày Phụ nữ Việt Nam</span>
        <div class="big">💖</div>
        <p class="t1">Gửi riêng cho</p>
        <h1 class="t2" id="name"></h1>
        <div class="orn">❀ ❤ ❀</div>
        <div id="msg"></div>
        <div class="wishes" id="wishes"></div>
        <div class="quote" id="quote"></div>
        <div class="sign" id="sign"></div>
        <div class="love" id="love">
          <div id="ask">
            <h2>Bạn có yêu mình không? 🥺</h2>
            <img
              id="lvimg"
              referrerpolicy="no-referrer"
              alt="Chú gấu dễ thương"
              src="https://media.giphy.com/media/cLS1cfxvGOPVpf9g3y/giphy.gif"
              onerror="
                this.replaceWith(
                  Object.assign(document.createElement('span'), {
                    textContent: '🧸',
                    className: 'bear',
                  }),
                )
              "
            />
            <div class="lv-act" id="lvact">
              <button id="yes">Có 💖</button>
              <button id="no">Không</button>
            </div>
          </div>
          <div id="done" hidden>
            <h2>Mình biết mà! ❤️</h2>
            <img
              id="lvimg2"
              referrerpolicy="no-referrer"
              alt="Chú gấu vui vẻ"
              src="https://media.giphy.com/media/T86i6yDyOYz7J6dPhf/giphy.gif"
              onerror="
                this.replaceWith(
                  Object.assign(document.createElement('span'), {
                    textContent: '🐻',
                    className: 'bear',
                  }),
                )
              "
            />
            <p class="ok-txt">Bạn đã chọn đúng rồi đó! 💕</p>
          </div>
        </div>
        <div class="btns" id="btns">
          <button class="b2" id="more">Thả thêm tim 💗</button>
          <small>hoặc nhấn phím Space ♡</small>
        </div>
      </div>
    </div>

    <script>
      // ✏️ Sửa nội dung ở đây — hoặc thêm ?ten=Mai vào cuối link để đổi tên người nhận
      const params = new URLSearchParams(location.search);
      const NAME = (params.get("ten") || "Nguyễn Khánh Linh").slice(0, 24);
      const CFG = {
        l1: "CHÚC MỪNG 20/10",
        l2: NAME.toUpperCase(),
        name: NAME,
        intro:
          "Nhân ngày 20/10, chúc " +
          NAME +
          " Chúc mừng ngày 20/10, người con gái tuyệt vời nhất của anh! Cảm ơn em đã đến, mang theo sự ấm áp và tình yêu dành cho anh. Mong rằng cô gái của anh luôn hạnh phúc, bình an và mãi giữ được nét hồn nhiên, đáng yêu này nhé. Hãy nhớ rằng dù ngoài kia có bao nhiêu áp lực, anh vẫn luôn ở đây, là bờ vai vững chắc để che chở và đồng hành cùng em. Anh yêu em rất nhiều, chúc em một ngày lễ thật trọn vẹn và ý nghĩa!🌸",
        wishes: [
          ["🌸", "Luôn xinh đẹp", "Rạng rỡ từ nụ cười đến trái tim."],
          ["💖", "Thật hạnh phúc", "Mỗi ngày đều có một niềm vui nhỏ."],
          ["✨", "Bình yên", "Nhẹ nhàng giữa mọi bộn bề."],
          ["🌹", "Được yêu thương", "Nhiều hơn bạn có thể đếm hết."],
        ],
        quote:
          "Cảm ơn bạn vì đã xuất hiện và làm thế giới này dịu dàng hơn rất nhiều.",
        sign: "— Một người luôn nghĩ đến bạn 🌹",
      };

      const POOL = "ABCDEFGHIKLMNOPQRSTUVXYĂÂÊÔƠƯ0123456789";
      const HEARTS = ["❤", "💖", "💗", "💕", "💘", "🌸", "🌹", "💝"];
      const R = (a, b) => Math.random() * (b - a) + a;
      const rnd = (a) => a[Math.floor(Math.random() * a.length)];
      const $ = (id) => document.getElementById(id);
      const COLORS = ["#ffb3d4", "#ff6fae", "#ffd9a8", "#e0b3ff", "#fff"];

      for (let i = 0; i < 60; i++) {
        const s = document.createElement("div");
        s.className = "star";
        s.style.cssText = `left:${R(0, 100)}vw;top:${R(0, 100)}vh;animation-delay:${R(0, 3)}s`;
        document.body.appendChild(s);
      }

      $("name").textContent = CFG.name;
      $("sign").textContent = CFG.sign;
      $("quote").textContent = CFG.quote;
      $("wishes").innerHTML = CFG.wishes
        .map(
          (w) =>
            `<div class="w"><i>${w[0]}</i><b>${w[1]}</b><span>${w[2]}</span></div>`,
        )
        .join("");

      const flyers = [];
      let W = innerWidth,
        H = innerHeight,
        decoding = false,
        landed = 0,
        total = 0;

      function build(el, text) {
        text.split(" ").forEach((word) => {
          const w = document.createElement("span");
          w.className = "word";
          [...word].forEach((c) => {
            const s = document.createElement("span");
            s.className = "slot";
            s.textContent = c;
            w.appendChild(s);
            flyers.push({ slot: s, c, real: true });
          });
          el.appendChild(w);
        });
      }
      build($("l1"), CFG.l1);
      build($("l2"), CFG.l2);
      total = flyers.length;

      function mk(f, size) {
        const e = document.createElement("div");
        e.className = "fly";
        e.style.fontSize = size + "px";
        e.style.opacity = f.real ? 1 : 0.55;
        e.style.color = rnd(COLORS);
        e.textContent = rnd(POOL);
        document.body.appendChild(e);
        Object.assign(f, {
          el: e,
          x: R(0, W),
          y: R(0, H),
          vx: R(-2.6, 2.6),
          vy: R(-2.6, 2.6),
          rot: R(0, 360),
          vr: R(-4, 4),
          t: R(0, 6),
          sc: 1,
          state: "fly",
        });
      }

      function init() {
        flyers.forEach((f) =>
          mk(f, parseFloat(getComputedStyle(f.slot).fontSize)),
        );
        for (let i = 0; i < 34; i++) {
          const f = { real: false };
          flyers.push(f);
          mk(f, R(18, 56));
        }
        requestAnimationFrame(tick);
      }

      function tick() {
        flyers.forEach((f) => {
          if (f.state === "done" || !f.el) return;
          if (f.state === "fly") {
            f.vx += R(-0.12, 0.12);
            f.vy += R(-0.12, 0.12);
            const m = Math.hypot(f.vx, f.vy);
            if (m > 3.2) {
              f.vx *= 3.2 / m;
              f.vy *= 3.2 / m;
            }
            f.x += f.vx;
            f.y += f.vy;
            f.rot += f.vr;
            f.t += 0.04;
            f.sc = 1 + Math.sin(f.t) * 0.35;
            if (f.x < 0 || f.x > W) f.vx *= -1;
            if (f.y < 0 || f.y > H) f.vy *= -1;
          } else {
            const k = 0.075;
            f.x += (f.tx - f.x) * k;
            f.y += (f.ty - f.y) * k;
            f.rot += -f.rot * k;
            f.sc += (1 - f.sc) * k;
            if (Math.hypot(f.tx - f.x, f.ty - f.y) < 1.2 && Math.abs(f.rot) < 1)
              land(f);
          }
          f.el.style.transform = `translate(${f.x}px,${f.y}px) translate(-50%,-50%) rotate(${f.rot}deg) scale(${f.sc})`;
        });
        requestAnimationFrame(tick);
      }

      function land(f) {
        f.state = "done";
        f.el.remove();
        f.slot.classList.add("ok");
        sparkle(f.slot);
        if (++landed === total) {
          $("hint").textContent = "Giải mã thành công 💖";
          heartStorm();
          setTimeout(showCard, 1800);
        }
      }

      setInterval(
        () =>
          flyers.forEach((f) => {
            if (f.el && f.state !== "done" && Math.random() < 0.4)
              f.el.textContent = rnd(POOL);
          }),
        150,
      );

      function decode() {
        if (decoding) return;
        decoding = true;
        $("btn").style.display = "none";
        $("hint").textContent = "Các chữ cái đang tìm về nhau… ✨";
        let i = 0;
        flyers.forEach((f) => {
          if (f.real) {
            setTimeout(
              () => {
                const r = f.slot.getBoundingClientRect();
                f.tx = r.left + r.width / 2;
                f.ty = r.top + r.height / 2;
                f.rot = (((f.rot % 360) + 540) % 360) - 180;
                f.state = "go";
                f.el.textContent = f.c;
              },
              600 + i++ * 160,
            );
          } else {
            setTimeout(
              () => {
                f.el.style.opacity = 0;
              },
              500 + R(0, 1500),
            );
            setTimeout(() => {
              f.state = "done";
              f.el.remove();
            }, 2600);
          }
        });
      }
      $("btn").onclick = decode;
      $("stage").addEventListener("click", (e) => {
        if (e.target.id !== "btn") decode();
      });
      addEventListener("resize", () => {
        W = innerWidth;
        H = innerHeight;
      });
      (document.fonts && document.fonts.ready
        ? document.fonts.ready
        : Promise.resolve()
      ).then(init);

      function burst(x, y, ch, size) {
        const b = document.createElement("div");
        b.className = "burst";
        b.textContent = ch;
        b.style.cssText += `left:${x}px;top:${y}px;font-size:${size + R(0, 10)}px;color:#ffc2dc;--bx:${R(-70, 70)}px;--by:${R(-70, 70)}px`;
        document.body.appendChild(b);
        setTimeout(() => b.remove(), 900);
      }
      function sparkle(el) {
        const r = el.getBoundingClientRect();
        for (let i = 0; i < 4; i++)
          burst(r.left + r.width / 2, r.top + r.height / 2, "✦", 10);
      }
      function heart() {
        const h = document.createElement("div");
        h.className = "heart";
        h.textContent = rnd(HEARTS);
        const d = R(5, 11);
        h.style.cssText += `left:${R(0, 100)}vw;font-size:${R(16, 44)}px;animation-duration:${d}s;--dx:${R(-80, 80)}px;--rot:${R(-40, 40)}deg;opacity:${R(0.6, 1)}`;
        document.body.appendChild(h);
        setTimeout(() => h.remove(), d * 1000);
      }
      function heartStorm() {
        for (let i = 0; i < 40; i++) setTimeout(heart, i * 60);
      }

      function showCard() {
        $("stage").classList.add("hide");
        $("card").classList.add("show");
        setInterval(heart, 280);
        heartStorm();
        let i = 0;
        setTimeout(function type() {
          $("msg").textContent = CFG.intro.slice(0, ++i);
          if (i < CFG.intro.length) return setTimeout(type, 40);
          document
            .querySelectorAll(".w")
            .forEach((w, k) =>
              setTimeout(() => w.classList.add("on"), k * 350),
            );
          setTimeout(() => $("quote").classList.add("on2"), 1700);
          setTimeout(() => $("sign").classList.add("on2"), 2500);
          setTimeout(() => {
            $("love").style.opacity = 1;
            placeNo();
          }, 3000);
          setTimeout(() => {
            $("btns").style.opacity = 1;
          }, 3600);
        }, 1200);
      }

      $("more").onclick = heartStorm;
      addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          decoding ? heartStorm() : decode();
        }
      });
      $("card").addEventListener("click", (e) => {
        if (e.target.tagName !== "BUTTON")
          for (let i = 0; i < 6; i++)
            burst(e.clientX, e.clientY, rnd(HEARTS), 18);
      });

      // Phần “Bạn có yêu mình không?”
      let tries = 0;
      function placeNo() {
        const a = $("lvact"),
          n = $("no"),
          y = $("yes");
        n.style.left = "calc(50% + 10px)";
        n.style.top = "0px";
        y.style.top = "0px";
      }
      function dodge(e) {
        e.preventDefault();
        const a = $("lvact"),
          n = $("no"),
          y = $("yes");
        tries++;
        const maxL = a.clientWidth - n.offsetWidth,
          maxT = a.clientHeight - n.offsetHeight;
        n.style.left = R(0, Math.max(0, maxL)) + "px";
        n.style.top = R(0, Math.max(0, maxT)) + "px";
        y.style.fontSize = Math.min(1 + tries * 0.12, 1.9) + "rem";
        y.style.left = "50%";
        y.style.transform = "translateX(-50%)";
        y.style.top = "0px";
        y.style.zIndex = 1;
        n.style.zIndex = 2;
        if (tries === 3) n.textContent = "Thật không? 🥲";
        if (tries === 6) n.textContent = "Nghĩ lại đi 🥺";
      }
      $("no").addEventListener("pointerenter", dodge);
      $("no").addEventListener("click", dodge);
      $("yes").addEventListener("click", () => {
        $("ask").hidden = true;
        $("done").hidden = false;
        heartStorm();
        setTimeout(heartStorm, 1200);
      });

      const cur = document.createElement("div");
      cur.id = "cur";
      cur.innerHTML = "<span>❤</span>";
      document.body.appendChild(cur);
      let lt = 0;
      addEventListener("pointermove", (e) => {
        if (e.pointerType !== "mouse") return;
        cur.style.transform = `translate(${e.clientX}px,${e.clientY}px) translate(-50%,-50%)`;
        cur.style.opacity = 1;
        const n = performance.now();
        if (n - lt < 50) return;
        lt = n;
        const t = document.createElement("div");
        t.className = "trail";
        t.textContent = rnd(["❤", "💖", "💗", "💕"]);
        t.style.cssText += `left:${e.clientX}px;top:${e.clientY}px;font-size:${R(10, 20)}px;--tx:${R(-30, 30)}px`;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 1100);
      });
      document.addEventListener("mouseleave", () => {
        cur.style.opacity = 0;
      });
    </script>
  </body>
</html>
